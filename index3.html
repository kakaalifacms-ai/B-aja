<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaget 😈</title>

  <style>
    body{
      margin:0;
      overflow:hidden;
      background:white;
      font-family:Arial, sans-serif;
    }

    #fotoKaget{
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%, -50%) scale(0.1);
      width:300px;
      animation:kaget 0.5s forwards;
      animation-delay:1s;
    }

    @keyframes kaget{
      from{
        transform:translate(-50%, -50%) scale(0.1);
      }
      to{
        transform:translate(-50%, -50%) scale(6);
      }
    }

    #akhir{
      display:none;
      height:100vh;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      text-align:center;
    }

    #akhir img{
      width:220px;
      border-radius:15px;
      margin:15px 0;
    }

    h1{
      margin:10px;
    }

    p{
      font-size:24px;
      font-weight:bold;
    }
  </style>
</head>
<body>

  <img id="fotoKaget" src="fotokaget.jpg">

  <div id="akhir">
    <h1>astagfirullah ngapain ?</h1>

    <img src="fotokwkw.jpg">

    <p>🗿🗿</p>
  </div>

  <script>
    setTimeout(() => {
      document.getElementById("fotoKaget").style.display = "none";
      document.getElementById("akhir").style.display = "flex";
    }, 1700);
  </script>

</body>
</html>
